spring.application.name=ExamService
server.port=${EXAMSERVICE_SERVER_PORT:8080}
server.servlet.context-path=/

spring.datasource.url=${EXAMSERVICE_DB_URL:jdbc:mysql://localhost:3306/exam_service}
spring.datasource.username=${EXAMSERVICE_DB_USERNAME:${EXAM_DB_USERNAME:root}}
spring.datasource.password=${EXAMSERVICE_DB_PASSWORD:${EXAM_DB_ROOT_PASSWORD:123456}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${EXAMSERVICE_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${EXAMSERVICE_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=${EXAMSERVICE_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${EXAMSERVICE_MULTIPART_MAX_REQUEST_SIZE:50MB}

examservice.jwt.base64-secret=${EXAMSERVICE_JWT_BASE64_SECRET:${JWT_SECRET:noVGO4KXfRQijWLkkHTdwMZzJcsvohOLNTzXHkWOEOwwj50/QWunAGce8b6XKqUwss6ozCb5A/e++2SPZN/d2Q==}}

management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

logging.level.root=INFO
logging.level.com.DoAn1.examservice=DEBUG

examservice.attempt.auto-submit.fixed-delay-ms=${EXAMSERVICE_ATTEMPT_AUTO_SUBMIT_DELAY_MS:30000}
examservice.storage.root-path=${EXAMSERVICE_STORAGE_ROOT_PATH:D:/DoAn/DoAn1_storage}
examservice.exam-paper.font-path=${EXAMSERVICE_EXAM_PAPER_FONT_PATH:C:/Windows/Fonts/arial.ttf}
examservice.scoring-service.host=${EXAMSERVICE_SCORING_SERVICE_HOST:localhost}
examservice.scoring-service.port=${EXAMSERVICE_SCORING_SERVICE_PORT:50051}
examservice.scoring-service.timeout-seconds=${EXAMSERVICE_SCORING_SERVICE_TIMEOUT_SECONDS:90}
examservice.management-service.host=${EXAMSERVICE_MANAGEMENT_SERVICE_HOST:localhost}
examservice.management-service.port=${EXAMSERVICE_MANAGEMENT_SERVICE_PORT:9092}
examservice.management-service.timeout-seconds=${EXAMSERVICE_MANAGEMENT_SERVICE_TIMEOUT_SECONDS:20}

